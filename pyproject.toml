[project]
name = "second-brain"
version = "0.1.0"
description = "Karpathy-style LLM-wiki second brain served over MCP"
authors = [
    { name = "Joshua Hoogstraat", email = "joshua.hoogstraat@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.3",
]

[project.scripts]
second-brain = "second_brain:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
